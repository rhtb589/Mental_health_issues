instrument:
  id: "GAD7"
  name: "Generalized Anxiety Disorder-7"
  abbreviation: "GAD-7"
  type: "symptom_screening_instrument"

  purpose:
    description: >
      Questionnaire assessing the frequency of seven problems related
      to generalized anxiety over the previous two weeks.

  source:
    document: "GAD-7_English.pdf"
    source_type: "provided_official_document"
    page: 1

  developers:
    - "Robert L. Spitzer"
    - "Janet B. W. Williams"
    - "Kurt Kroenke"
    - "colleagues"

  reproduction:
    permission_statement: >
      The provided document states that no permission is required to
      reproduce, translate, display or distribute the instrument.

administration:
  recall_period:
    value: 2
    unit: "weeks"

  number_of_items: 7

  response_type: "frequency"

  instructions: >
    Over the last 2 weeks, how often have you been bothered by the
    following problems?

response_scale:
  - score: 0
    label: "Not at all"

  - score: 1
    label: "Several days"

  - score: 2
    label: "More than half the days"

  - score: 3
    label: "Nearly every day"

scoring:
  method: "sum"
  minimum_score: 0
  maximum_score: 21

  item_score_range:
    minimum: 0
    maximum: 3

  number_of_items: 7

interpretation:
  status: "requires_verified_scoring_guidance"

  note: >
    The provided GAD-7 PDF contains the item scoring values and total
    score field, but does not provide score-severity interpretation
    bands. These should be populated from an authoritative GAD-7
    scoring/interpretation source after clinical verification.

functional_impact:
  included: false

safety:
  enabled: false

diagnostic_use:
  diagnostic_test: false
  diagnosis_from_score: false

clinical_use:
  professional_review: true

version:
  instrument_version: "not specified in provided PDF"
  source_verified_date: null

provenance:
  source_file: "GAD-7_English.pdf"
  source_page: 1
